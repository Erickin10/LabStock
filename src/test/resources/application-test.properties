# ===========================================
# PERFIL DE TESTE (usado com @ActiveProfiles("test"))
# Sobrescreve o application.properties so durante os testes
# ===========================================

# Banco H2 em memoria: nasce quando os testes comecam e some quando terminam.
# MODE=PostgreSQL faz o H2 entender o SQL parecido com o do Postgres.
spring.datasource.url=jdbc:h2:mem:labstock_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No teste quem cria as tabelas e o Hibernate (a partir das @Entity), nao o Flyway
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Sobrescreve o PostgreSQLDialect do application.properties (o Hibernate avisa que e redundante, mas e inofensivo)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logs de SQL desligados para o console dos testes ficar limpo
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
