# ===========================================
# CONFIGURACOES DO LABSTOCK
# ===========================================

# Nome da aplicacao (aparece nos logs do Spring)
spring.application.name=LabStock

# ===========================================
# CONEXAO COM O BANCO DE DADOS (PostgreSQL)
# ===========================================

# URL de conexao: jdbc:postgresql://host:porta/nome_do_banco
spring.datasource.url=jdbc:postgresql://localhost:5432/labstock

# Credenciais do banco
spring.datasource.username=system
spring.datasource.password=system

# ===========================================
# FLYWAY
# ===========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# Driver do PostgreSQL — o Spring usa isso para saber "como" se conectar ao banco
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# JPA / HIBERNATE
# ===========================================

# ddl-auto=update faz o Hibernate criar/atualizar tabelas automaticamente
# baseando-se nas classes @Entity. Nao precisa escrever SQL para criar tabelas.
# Opcoes: none (nao faz nada), validate (so valida), update (cria/atualiza), create (recria tudo)
spring.jpa.hibernate.ddl-auto=validate

# Diz ao Hibernate qual "dialeto" SQL usar — cada banco tem suas particularidades
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# show-sql=true mostra no console as queries SQL que o Hibernate gera
# Util para aprender e debugar, mas em producao seria false
spring.jpa.show-sql=true

# format_sql=true formata as queries SQL no console para ficarem legíveis
# Sem isso, a query aparece tudo numa linha so
spring.jpa.properties.hibernate.format_sql=true

# open-in-view=false desliga o padrao "Open Session in View" do Spring
# Isso evita que o Hibernate faca queries inesperadas durante a renderizacao da resposta
# E uma boa pratica mesmo para iniciantes
spring.jpa.open-in-view=false

# ===========================================
# SERVIDOR
# ===========================================

# Porta onde a aplicacao roda. Padrao do Spring e 8080.
# Acesse em: http://localhost:8080
server.port=8080

# ===========================================
# API EXTERNA (RestCountries)
# ===========================================

restcountries.api.token=rc_live_demo